[package]
name = 'xdot'
version = "0.2.4"
authors = ['Philipp A. <flying-sheep@web.de>']
edition = '2024'
description = 'Parse graphviz’ xdot draw instructions'
documentation = 'https://docs.rs/xdot'
readme = 'README.md'
repository = 'https://github.com/flying-sheep/xdot-rs'
license = 'GPL-3.0'
keywords = ['graphviz', 'graph']
categories = ['parser-implementations', 'rendering::data-formats']

[package.metadata.docs.rs]
all-features = true

[features]
## The `layout` feature allows to parse `xdot` attributes from
## [graphviz_rust]’s [Graph](graphviz_rust::dot_structures::Graph)s
## using [draw_graph].
layout = ['graphviz-rust', 'thiserror']
## The `pyo3` feature is for using the crate from Python.
pyo3 = ['dep:pyo3']

[dependencies]
bitflags = '2.13.2'
document-features = { version = '0.2.12', optional = true }
graphviz-rust = { version = '0.9.9', optional = true }
nom = '8.0.0'
pest = '2.9.3'
pest_derive = '2.9.3'
thiserror = { version = '2.0.21', optional = true }
pyo3 = { version = '0.30.1', optional = true, features = ['abi3-py39', 'multiple-pymethods', 'experimental-inspect'] }
pastey = "0.2.3"

[build-dependencies]
rustc_version = '0.4.1'
